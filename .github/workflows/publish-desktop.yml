name: publish-desktop

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Desktop workflow run whose artifacts should be published'
        required: true
      tag:
        description: 'Release tag, e.g. desktop-v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: publish a built release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the built artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets/raw
          gh run download "${{ inputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'sigilgen-desktop-*' \
            --dir release-assets/raw
          find release-assets/raw -type f -exec mv {} release-assets/ \;
          rm -rf release-assets/raw
          # Keep the installers and drop the updater metadata, block maps and debug files.
          find release-assets -maxdepth 1 -type f \
            ! \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
            -delete
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Ensure a draft release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          version="${tag#desktop-v}"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\") | .id" | head -n 1)"
          if [ -z "$release_id" ]; then
            release_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$tag" \
              -f name="Sigilgen Desktop ${version}" \
              -f draft=true \
              --jq .id)"
          fi
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          release_id="${{ steps.release.outputs.id }}"
          assets_url="repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100"
          failed=0
          for file in release-assets/*; do
            name="$(basename "$file")"
            state="$(gh api "$assets_url" --jq ".[] | select(.name == \"${name}\") | .state" | head -n 1)"
            if [ "$state" = "uploaded" ]; then
              echo "already uploaded: $name"
              continue
            fi
            if [ -n "$state" ]; then
              asset_id="$(gh api "$assets_url" --jq ".[] | select(.name == \"${name}\") | .id" | head -n 1)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
            uploaded=0
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$tag" "$file"; then
                uploaded=1
                break
              fi
              echo "retry ${attempt} for ${name}"
              sleep 15
            done
            if [ "$uploaded" -ne 1 ]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          version="${tag#desktop-v}"
          notes="docs/releases/desktop-${version}.md"
          release_id="${{ steps.release.outputs.id }}"
          if [ -f "$notes" ]; then
            body="$(cat "$notes")"
          else
            body="Sigilgen Desktop ${version}"
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f name="Sigilgen Desktop ${version}" \
            -F draft=false \
            -F make_latest=true \
            -f body="$body"
