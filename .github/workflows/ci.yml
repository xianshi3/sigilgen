name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, format, typecheck, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Format check
        run: pnpm run fmt:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # The committed brain must match what the compiler produces, or a local build and CI disagree
      # about what the generated data actually is.
      - name: Verify the brain matches its compiler
        run: pnpm run check:brain

      - name: Build
        run: pnpm build

      - name: Smoke test the CLI
        run: node dist/cli.js --name "Acme" --keywords "tech, minimal" --json > smoke.json

      # `sharp` is an optional dependency, so SVG output must work whether or not it installed — and a
      # native module can fail to build on any given runner image. Exit code 3 is the CLI reporting
      # exactly that, which is not a failure of this project; any other non-zero code is.
      # `--output` is required for anything to be rasterised: without it the CLI only writes SVG to
      # stdout, so this step would silently test nothing. `shell: bash` so one script covers the
      # PowerShell default on the Windows runner too.
      - name: Smoke test PNG rasterization
        shell: bash
        run: |
          set +e
          node dist/cli.js --name "Acme" --keywords "tech, minimal" \
            --png --png-size 256 --output "$RUNNER_TEMP/smoke" --quiet
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "sharp is unavailable on this runner; SVG output is unaffected."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          # Prove a bitmap was really produced rather than trusting the exit code.
          ls "$RUNNER_TEMP"/smoke/*.png

  determinism:
    name: byte-identical output across platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The manifest was recorded on one platform. Passing on all of them is the actual claim: identical
      # input yields identical bytes regardless of OS, Node version or working directory.
      - name: Verify byte-identical output against the recorded manifest
        run: node scripts/check-determinism.mjs
